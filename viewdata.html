<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Email</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            color: #667eea;
            font-size: 24px;
        }

        .btn-back {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }

        .btn-back:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-refresh {
            background: #48bb78;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-refresh:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        .btn-check-live {
            background: #f59e0b;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-check-live:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-check-live:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .data-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: #f7fafc;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .data-count {
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
        }

        .check-status {
            color: #f59e0b;
            font-weight: 600;
            font-size: 14px;
        }

        /* ===== PAGINATION ===== */
        .pagination-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 15px;
            background: #f7fafc;
            border-radius: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .per-page-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .per-page-selector label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .per-page-selector select {
            padding: 6px 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            background: white;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }

        .per-page-selector select:hover {
            background: #f0f2ff;
        }

        .page-info {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .page-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 6px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            color: #555;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 36px;
            text-align: center;
        }

        .page-btn:hover:not(:disabled) {
            border-color: #667eea;
            color: #667eea;
            background: #f0f2ff;
        }

        .page-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-btn.ellipsis {
            border-color: transparent;
            background: transparent;
            cursor: default;
            color: #aaa;
        }

        /* Mobile Card Layout */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .email-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            transition: all 0.3s;
        }

        .email-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .card-number {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .card-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-trail { background: #c6f6d5; color: #22543d; }
        .badge-no-trail { background: #fed7d7; color: #742a2a; }
        .badge-live { background: #c6f6d5; color: #22543d; }
        .badge-die { background: #fed7d7; color: #742a2a; }
        .badge-verify-phone { background: #fef3c7; color: #78350f; }
        .badge-checking { background: #e0e7ff; color: #3730a3; }

        .card-row {
            display: flex;
            margin-bottom: 8px;
            align-items: flex-start;
        }

        .card-label {
            font-weight: 600;
            color: #666;
            min-width: 80px;
            font-size: 13px;
        }

        .card-value {
            color: #333;
            flex: 1;
            word-break: break-all;
            font-size: 14px;
        }

        .card-email {
            color: #667eea;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667eea;
            font-size: 16px;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
        }

        .error {
            text-align: center;
            padding: 60px 20px;
            color: #f56565;
            font-size: 16px;
        }

        /* Desktop Table Layout */
        @media (min-width: 768px) {
            .card-list { display: none; }

            .table-wrapper {
                display: block;
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            table th {
                background: #667eea;
                color: white;
                padding: 12px;
                text-align: left;
                font-weight: 600;
                position: sticky;
                top: 0;
            }

            table td {
                padding: 12px;
                border-bottom: 1px solid #e0e0e0;
            }

            table tr:hover { background: #f7fafc; }
            table tr:nth-child(even) { background: #f9f9f9; }

            .badge-trail, .badge-no-trail, .badge-live, .badge-die,
            .badge-verify-phone, .badge-checking {
                display: inline-block;
            }
        }

        @media (max-width: 767px) {
            .table-wrapper { display: none; }
            .card-list { display: flex; }

            .pagination-controls {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Danh sách Email</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn-check-live" id="btnCheckLive" onclick="checkAllEmailsLive()">🔍 Check Live</button>
                <button class="btn-refresh" onclick="loadData()">🔄 Refresh</button>
                <a href="index.html" class="btn-back">← Quay lại</a>
            </div>
        </div>

        <div class="data-info">
            <div class="data-count" id="dataCount">Đang tải...</div>
            <div class="check-status" id="checkStatus"></div>
        </div>

        <!-- Pagination Controls -->
        <div class="pagination-controls" id="paginationControls" style="display:none;">
            <div class="per-page-selector">
                <label>Hiển thị:</label>
                <select id="perPageSelect" onchange="changePerPage()">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <label>bản ghi / trang</label>
            </div>
            <div class="page-info" id="pageInfo"></div>
            <div class="page-nav" id="pageNav"></div>
        </div>

        <!-- Mobile Card View -->
        <div class="card-list" id="cardList">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>Đang tải dữ liệu...</div>
            </div>
        </div>

        <!-- Desktop Table View -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Email</th>
                        <th>Status Live</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4" class="loading">
                            <div class="loading-spinner"></div>
                            <div>Đang tải dữ liệu...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination Bottom -->
        <div class="pagination-controls" id="paginationControlsBottom" style="display:none; margin-top:15px; margin-bottom:0;">
            <div class="page-info" id="pageInfoBottom"></div>
            <div class="page-nav" id="pageNavBottom"></div>
        </div>
    </div>

    <script>
        let emailData = [];
        let currentPage = 1;
        let perPage = 10;

        const API_KEY = "ad3c7977268e5c3c15479427e5df01c0";
        const PROXY_URL = "https://script.google.com/macros/s/AKfycbwxeMIfJJoRtEw8Hxd_QRhVlMD2YC074XcbgAEk58DdqVwGJQuMGcDArlEvXIp4-V2zsQ/exec";

        window.onload = function() { loadData(); };

        // Parse date từ nhiều định dạng — trả về timestamp (ms), -Infinity nếu không parse được
        function parseDate(str) {
            if (!str) return -Infinity;

            const s = str.toString().trim();

            // Định dạng: dd/mm/yyyy hh:mm:ss  hoặc  dd/mm/yyyy
            const dmyFull = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[T\s](\d{2}):(\d{2}):(\d{2}))?/);
            if (dmyFull) {
                const [, d, mo, y, h = '0', mi = '0', sec = '0'] = dmyFull;
                const dt = new Date(+y, +mo - 1, +d, +h, +mi, +sec);
                if (!isNaN(dt)) return dt.getTime();
            }

            // Định dạng: yyyy-mm-dd hh:mm:ss  hoặc  ISO 8601
            const isoFull = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}):(\d{2}):(\d{2}))?/);
            if (isoFull) {
                const [, y, mo, d, h = '0', mi = '0', sec = '0'] = isoFull;
                const dt = new Date(+y, +mo - 1, +d, +h, +mi, +sec);
                if (!isNaN(dt)) return dt.getTime();
            }

            // Thử native parse cuối cùng
            const fallback = new Date(s);
            return isNaN(fallback) ? -Infinity : fallback.getTime();
        }

        async function loadData() {
            const cardList = document.getElementById('cardList');
            const tableBody = document.getElementById('tableBody');
            const dataCount = document.getElementById('dataCount');
            const paginationControls = document.getElementById('paginationControls');
            const paginationControlsBottom = document.getElementById('paginationControlsBottom');

            cardList.innerHTML = '<div class="loading"><div class="loading-spinner"></div><div>Đang tải dữ liệu...</div></div>';
            tableBody.innerHTML = '<tr><td colspan="4" class="loading"><div class="loading-spinner"></div><div>Đang tải dữ liệu...</div></td></tr>';
            dataCount.textContent = 'Đang tải...';
            paginationControls.style.display = 'none';
            paginationControlsBottom.style.display = 'none';

            try {
                const scriptUrl = 'https://script.google.com/macros/s/AKfycbytvG-tfmicCmWLLt6hBH5gh7D-k_zWLeQLZl2TQ1D7VDoDaFWMBVtzrl6gfekiXhr7/exec';

                const result = await new Promise((resolve, reject) => {
                    const callbackName = 'jsonpCallback_' + Date.now();
                    window[callbackName] = function(data) {
                        delete window[callbackName];
                        document.body.removeChild(script);
                        resolve(data);
                    };
                    const script = document.createElement('script');
                    script.src = scriptUrl + '?callback=' + callbackName;
                    script.onerror = () => {
                        delete window[callbackName];
                        reject(new Error('Failed to load data'));
                    };
                    document.body.appendChild(script);
                    setTimeout(() => {
                        if (window[callbackName]) {
                            delete window[callbackName];
                            document.body.removeChild(script);
                            reject(new Error('Request timeout'));
                        }
                    }, 10000);
                });

                if (result.status === 'success' && result.data && result.data.length > 0) {
                    emailData = result.data
                        .map(item => ({ ...item, liveStatus: null }))
                        // Sắp xếp: ngày tạo gần nhất lên đầu
                        .sort((a, b) => parseDate(b.created_at) - parseDate(a.created_at));

                    currentPage = 1;
                    renderEmailList();
                } else {
                    cardList.innerHTML = '<div class="no-data">Không có dữ liệu</div>';
                    tableBody.innerHTML = '<tr><td colspan="4" class="no-data">Không có dữ liệu</td></tr>';
                    dataCount.textContent = 'Tổng số: 0 bản ghi';
                }
            } catch (error) {
                cardList.innerHTML = `<div class="error">❌ Lỗi: ${error.message}</div>`;
                tableBody.innerHTML = `<tr><td colspan="4" class="error">❌ Lỗi: ${error.message}</td></tr>`;
                dataCount.textContent = 'Lỗi tải dữ liệu';
            }
        }

        function changePerPage() {
            perPage = parseInt(document.getElementById('perPageSelect').value);
            currentPage = 1;
            renderEmailList();
        }

        function goToPage(page) {
            const totalPages = Math.ceil(emailData.length / perPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderEmailList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPagination(containerId, infoId) {
            const totalPages = Math.ceil(emailData.length / perPage);
            const start = (currentPage - 1) * perPage + 1;
            const end = Math.min(currentPage * perPage, emailData.length);

            document.getElementById(infoId).textContent =
                `Trang ${currentPage}/${totalPages} — Hiển thị ${start}–${end} / ${emailData.length} bản ghi`;

            const nav = document.getElementById(containerId);
            let html = '';

            html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹ Trước</button>`;

            const pages = getPageNumbers(currentPage, totalPages);
            pages.forEach(p => {
                if (p === '...') {
                    html += `<button class="page-btn ellipsis">…</button>`;
                } else {
                    html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
                }
            });

            html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Sau ›</button>`;

            nav.innerHTML = html;
        }

        function getPageNumbers(current, total) {
            if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
            const pages = [];
            if (current <= 4) {
                pages.push(1, 2, 3, 4, 5, '...', total);
            } else if (current >= total - 3) {
                pages.push(1, '...', total - 4, total - 3, total - 2, total - 1, total);
            } else {
                pages.push(1, '...', current - 1, current, current + 1, '...', total);
            }
            return pages;
        }

        function renderEmailList() {
            const cardList = document.getElementById('cardList');
            const tableBody = document.getElementById('tableBody');
            const dataCount = document.getElementById('dataCount');
            const paginationControls = document.getElementById('paginationControls');
            const paginationControlsBottom = document.getElementById('paginationControlsBottom');

            dataCount.textContent = `Tổng số: ${emailData.length} bản ghi`;

            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageData = emailData.slice(start, end);

            // Mobile cards
            let cardHtml = '';
            pageData.forEach((item, idx) => {
                const globalIndex = start + idx + 1;
                const statusBadge = item.liveStatus
                    ? getLiveStatusBadge(item.liveStatus)
                    : getDataStatusBadge(item.status);
                cardHtml += `
                    <div class="email-card">
                        <div class="card-header">
                            <span class="card-number">#${globalIndex}</span>
                            <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                                ${statusBadge}
                            </div>
                        </div>
                        <div class="card-row">
                            <span class="card-label">📧 Email:</span>
                            <span class="card-value card-email">${item.email || '-'}</span>
                        </div>
                        <div class="card-row">
                            <span class="card-label">📅 Created:</span>
                            <span class="card-value">${item.created_at || '-'}</span>
                        </div>
                    </div>
                `;
            });
            cardList.innerHTML = cardHtml || '<div class="no-data">Không có dữ liệu</div>';

            // Desktop table
            let tableHtml = '';
            pageData.forEach((item, idx) => {
                const globalIndex = start + idx + 1;
                const statusBadge = item.liveStatus
                    ? getLiveStatusBadge(item.liveStatus)
                    : getDataStatusBadge(item.status);
                tableHtml += `
                    <tr>
                        <td>${globalIndex}</td>
                        <td>${item.email || '-'}</td>
                        <td>${statusBadge || '-'}</td>
                        <td>${item.created_at || '-'}</td>
                    </tr>
                `;
            });
            tableBody.innerHTML = tableHtml || '<tr><td colspan="4" class="no-data">Không có dữ liệu</td></tr>';

            paginationControls.style.display = 'flex';
            paginationControlsBottom.style.display = 'flex';

            renderPagination('pageNav', 'pageInfo');
            renderPagination('pageNavBottom', 'pageInfoBottom');
        }

        function getLiveStatusBadge(status) {
            if (!status) return '';
            const map = {
                live: ['badge-live', '✅ Live'],
                die: ['badge-die', '❌ Die'],
                verify_phone: ['badge-verify-phone', '📱 Verify Phone'],
                checking: ['badge-checking', '⏳ Checking...']
            };
            const [cls, text] = map[status] || ['', status];
            return `<span class="card-badge ${cls}">${text}</span>`;
        }

        function getDataStatusBadge(status) {
            if (!status) return '';
            const s = status.toString().toLowerCase().trim();
            const map = {
                'live': ['badge-live', '✅ Live'],
                'die': ['badge-die', '❌ Die'],
                'verify_phone': ['badge-verify-phone', '📱 Verify Phone'],
                'verify phone': ['badge-verify-phone', '📱 Verify Phone'],
            };
            const [cls, text] = map[s] || ['badge-checking', status];
            return `<span class="card-badge ${cls}">${text}</span>`;
        }

        async function checkAllEmailsLive() {
            if (emailData.length === 0) {
                alert('Không có email để kiểm tra!');
                return;
            }

            const btnCheckLive = document.getElementById('btnCheckLive');
            const checkStatus = document.getElementById('checkStatus');

            btnCheckLive.disabled = true;
            btnCheckLive.textContent = '⏳ Đang check...';

            const emails = emailData.map(item => item.email).filter(Boolean);
            const batchSize = 1000;
            const batches = [];
            for (let i = 0; i < emails.length; i += batchSize) batches.push(emails.slice(i, i + batchSize));

            let totalChecked = 0, totalLive = 0, totalDie = 0, totalVerifyPhone = 0;

            try {
                for (let batchIndex = 0; batchIndex < batches.length; batchIndex++) {
                    const batch = batches[batchIndex];
                    checkStatus.textContent = `Đang check batch ${batchIndex + 1}/${batches.length} (${batch.length} emails)...`;

                    batch.forEach(email => {
                        const item = emailData.find(d => d.email === email);
                        if (item) item.liveStatus = 'checking';
                    });
                    renderEmailList();

                    const response = await fetch(PROXY_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ api_key: API_KEY, emails: batch })
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const result = await response.json();

                    if (result.status && result.data) {
                        result.data.forEach(emailResult => {
                            const item = emailData.find(d => d.email === emailResult.email);
                            if (item) {
                                item.liveStatus = emailResult.status;
                                totalChecked++;
                                if (emailResult.status === 'live') totalLive++;
                                else if (emailResult.status === 'die') totalDie++;
                                else if (emailResult.status === 'verify_phone') totalVerifyPhone++;
                            }
                        });
                        renderEmailList();
                    } else {
                        throw new Error(result.message || 'API trả về lỗi');
                    }

                    if (batchIndex < batches.length - 1) await new Promise(r => setTimeout(r, 1000));
                }

                checkStatus.textContent = `✅ Hoàn thành! Live: ${totalLive} | Die: ${totalDie} | Verify: ${totalVerifyPhone}`;
                alert(`Check xong!\n\n✅ Live: ${totalLive}\n❌ Die: ${totalDie}\n📱 Verify Phone: ${totalVerifyPhone}\n\nTổng: ${totalChecked}/${emails.length}`);

            } catch (error) {
                console.error('Error checking emails:', error);
                checkStatus.textContent = `❌ Lỗi: ${error.message}`;
                alert('Có lỗi xảy ra khi check email:\n\n' + error.message + '\n\nVui lòng kiểm tra:\n1. Google Apps Script đã deploy đúng chưa?\n2. Code proxy đã cập nhật chưa?\n3. Xem Console (F12) để biết thêm chi tiết');
            } finally {
                btnCheckLive.disabled = false;
                btnCheckLive.textContent = '🔍 Check Live';
            }
        }
    </script>
