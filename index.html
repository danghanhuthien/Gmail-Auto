<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        input, select {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            cursor: pointer;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        input:read-only {
            background: #f5f5f5;
        }

        select {
            background: white;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .btn-generate {
            background: #667eea;
            color: white;
        }

        .btn-generate:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-get-code {
            background: #48bb78;
            color: white;
        }

        .btn-get-code:hover {
            background: #38a169;
            transform: translateY(-2px);
        }

        /* 2FA section styling */
        .twofa-section {
            background: linear-gradient(135deg, #fff8e1 0%, #fff3cd 100%);
            border: 2px solid #f6c90e;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .twofa-section .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #b7791f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .twofa-section .input-group {
            margin-bottom: 12px;
        }

        .twofa-section .input-group:last-child {
            margin-bottom: 0;
        }

        .twofa-section label {
            color: #744210;
        }

        .twofa-section input {
            border-color: #f6c90e;
            background: white;
        }

        .twofa-section input:read-only {
            background: #fffbeb;
        }

        .twofa-section input:focus {
            border-color: #d97706;
        }

        .btn-2fa {
            background: #d97706;
            color: white;
        }

        .btn-2fa:hover {
            background: #b45309;
            transform: translateY(-2px);
        }

        .btn-submit {
            width: 100%;
            background: #f56565;
            color: white;
            padding: 15px;
            font-size: 16px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #e53e3e;
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            padding: 10px 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }

        .status.success {
            background: #c6f6d5;
            color: #22543d;
            display: block;
        }

        .status.error {
            background: #fed7d7;
            color: #742a2a;
            display: block;
        }

        .status.info {
            background: #bee3f8;
            color: #2c5282;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-view-data {
            width: 100%;
            background: #48bb78;
            color: white;
            padding: 15px;
            font-size: 16px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-view-data:hover {
            background: #38a169;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📧 Email Verification</h1>
        
        <div class="input-group">
            <label>Email gốc</label>
            <div class="input-wrapper">
                <input type="text" id="emailInput" readonly placeholder="Để trống sẽ tự tạo email">
                <button class="btn-generate" onclick="generateEmail()">Generate</button>
            </div>
        </div>

        <div class="input-group">
            <label>Username (không có @gmail.com)</label>
            <input type="text" id="usernameInput" readonly placeholder="Username sẽ được tạo tự động">
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
                <input type="text" id="passwordInput" readonly placeholder="Nhập password hoặc Generate">
                <button class="btn-generate" onclick="generatePassword()">Generate</button>
            </div>
        </div>

        <div class="input-group">
            <label>Số điện thoại</label>
            <div class="input-wrapper">
                <input type="text" id="phoneInput" readonly placeholder="Số sẽ được tạo tự động">
                <button class="btn-generate" onclick="getOTP()">Get OTP</button>
            </div>
        </div>

        <div class="input-group">
            <label>SMS Code</label>
            <div class="input-wrapper">
                <input type="text" id="smsCodeInput" readonly placeholder="Code SMS sẽ được lấy tự động">
                <button class="btn-get-code" onclick="checkSMS()">Check SMS</button>
            </div>
        </div>

        <div class="input-group">
            <label>Email khôi phục (mailkp)</label>
            <div class="input-wrapper">
                <input type="text" id="mailkpInput" readonly placeholder="Email sẽ được tạo tự động">
                <button class="btn-get-code" onclick="getCode()">Get Code</button>
            </div>
        </div>

        <div class="input-group">
            <label>Verification Code</label>
            <input type="text" id="codeInput" readonly placeholder="Code sẽ được lấy tự động">
        </div>

        <!-- 2FA SECTION -->
        <div class="twofa-section">
            <div class="section-title">🔐 2FA Authentication</div>

            <div class="input-group">
                <label>Email 2FA (nhập thủ công hoặc tự động)</label>
                <div class="input-wrapper">
                    <input type="text" id="email2faInput" placeholder="Email nhận mã 2FA" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    <button class="btn-2fa" onclick="get2FACode()">Get Code</button>
                </div>
            </div>

            <div class="input-group">
                <label>Mã 2FA</label>
                <input type="text" id="code2faInput" readonly placeholder="Mã 2FA sẽ được lấy tự động">
            </div>
        </div>

        <div class="input-group">
            <label>Trail</label>
            <select id="trailInput">
                <option value="Không Trail">Không Trail</option>
                <option value="Có Trail">Có Trail</option>
            </select>
        </div>

        <button class="btn-submit" onclick="submitData()">Submit</button>

        <a href="viewdata.html" class="btn-view-data">📊 Xem dữ liệu</a>

        <div id="status" class="status"></div>
    </div>

    <script>
        let currentOrderId = null;
        
        // Auto copy khi click vào input có dữ liệu
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('click', function() {
                if (this.value) {
                    this.select();
                    document.execCommand('copy');
                    showStatus('Đã copy: ' + this.value, 'success');
                }
            });
        });

        function generateRandomString(length) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function generateRandomName() {
            const firstNames = ['nguyen', 'tran', 'le', 'pham', 'hoang', 'vo', 'dang', 'bui', 'duong', 'ngo', 'ly', 'vuong', 'trinh', 'dao', 'mai', 'ta', 'ha', 'do', 'dinh', 'phan', 'cao'];
            const middleNames = ['van', 'thi', 'duc', 'minh', 'hoang', 'kim', 'thanh', 'quoc', 'anh', 'tuan', 'hong', 'huong', 'duy', 'thang', 'hai', 'long', 'ngoc', 'xuan', 'thu', 'phuoc', 'huu', 'trung'];
            const lastNames = ['hung', 'linh', 'hoa', 'lan', 'son', 'nga', 'thu', 'binh', 'phuong', 'hieu', 'khoa', 'phong', 'dung', 'quan', 'tuan', 'tai', 'nam', 'nhi', 'tam', 'tu', 'nhat', 'hai'];
            const suffixes = ['dj', 'pro', 'vip', 'official', 'real', 'kp', 'bat', 'dev', 'main', 'acc', 'haka', 'kaxi', 'boss', 'king', 'tech', 'cute', 'love', 'gaming', 'music', 'art', 'cool', 'super', 'mega', 'ultra', 'top', 'best', 'star'];
            const connectors = ['x', 'z', 'v', 'k', 'the', 'mr', 'ms', 'dr', 'sir'];
            
            const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const middleName = middleNames[Math.floor(Math.random() * middleNames.length)];
            const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            const connector = connectors[Math.floor(Math.random() * connectors.length)];
            const randomNum = Math.floor(Math.random() * 90000) + 10000;
            const shortNum = Math.floor(Math.random() * 9000) + 1000;
            
            const formats = [
                `${firstName}${middleName}${lastName}${suffix}${randomNum}`,
                `${lastName}${firstName}${middleName}${suffix}${randomNum}`,
                `${firstName}${lastName}${middleName}${suffix}${randomNum}`,
                `${middleName}${firstName}${lastName}${suffix}${randomNum}`,
                `${firstName}${middleName}${suffix}${lastName}${randomNum}`,
                `${suffix}${firstName}${middleName}${lastName}${randomNum}`,
                `${firstName}${connector}${lastName}${suffix}${randomNum}`,
                `${lastName}${connector}${firstName}${suffix}${randomNum}`,
                `${firstName}${lastName}${randomNum}${suffix}`,
                `${suffix}${randomNum}${firstName}${lastName}`,
                `${firstName}${middleName}${randomNum}`,
                `${lastName}${firstName}${shortNum}${suffix}`,
                `${connector}${firstName}${lastName}${suffix}${randomNum}`,
                `${firstName}${suffix}${middleName}${lastName}${randomNum}`,
                `${lastName}${suffix}${firstName}${randomNum}`
            ];
            
            return formats[Math.floor(Math.random() * formats.length)];
        }

        function generateRandomPassword() {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const numbers = '0123456789';
            const specials = '@$%&!#';
            
            let password = '';
            const length = 10 + Math.floor(Math.random() * 5);
            
            password += chars.charAt(Math.floor(Math.random() * 26));
            password += chars.charAt(26 + Math.floor(Math.random() * 26));
            password += numbers.charAt(Math.floor(Math.random() * numbers.length));
            password += specials.charAt(Math.floor(Math.random() * specials.length));
            
            const allChars = chars + numbers + specials;
            for (let i = password.length; i < length; i++) {
                password += allChars.charAt(Math.floor(Math.random() * allChars.length));
            }
            
            password = password.split('').sort(() => Math.random() - 0.5).join('');
            return password;
        }

        function generatePassword() {
            const password = generateRandomPassword();
            document.getElementById('passwordInput').value = password;
            showStatus('✅ Đã tạo password: ' + password, 'success');
        }

        async function getOTP() {
            showStatus('Đang thuê số điện thoại...', 'info');

            try {
                const response = await fetch('https://gmailios.vn/api/order-sms/5/xsh9TXWCusAR83zcRptZEuls6ocp9j/viettel', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    const phoneNumber = result.data.phone_number;
                    currentOrderId = result.data.id;
                    document.getElementById('phoneInput').value = phoneNumber;
                    showStatus(`✅ Đã thuê số: ${phoneNumber}`, 'success');
                } else {
                    showStatus('❌ Không thể thuê số điện thoại', 'error');
                }
            } catch (error) {
                showStatus('❌ Lỗi khi thuê số: ' + error.message, 'error');
            }
        }

        async function checkSMS() {
            if (!currentOrderId) {
                showStatus('Vui lòng Get OTP trước', 'error');
                return;
            }

            showStatus('Đang kiểm tra SMS...', 'info');

            try {
                const response = await fetch(`https://gmailios.vn/api/check-order/${currentOrderId}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    const codeOtp = result.data.code_otp;
                    if (codeOtp && codeOtp !== '') {
                        document.getElementById('smsCodeInput').value = codeOtp;
                        showStatus(`✅ Đã nhận được SMS Code: ${codeOtp}`, 'success');
                    } else {
                        showStatus('⚠️ Chưa nhận được SMS. Thử lại sau...', 'error');
                    }
                } else {
                    showStatus('❌ Không thể kiểm tra SMS', 'error');
                }
            } catch (error) {
                showStatus('❌ Lỗi khi check SMS: ' + error.message, 'error');
            }
        }

        async function generateEmail() {
            let emailInput = document.getElementById('emailInput').value;
            
            if (!emailInput || !emailInput.includes('@gmail.com')) {
                const randomUsername = generateRandomName();
                emailInput = randomUsername + '@gmail.com';
                document.getElementById('emailInput').value = emailInput;
            }

            const username = emailInput.split('@gmail.com')[0];
            document.getElementById('usernameInput').value = username;
            
            const randomStr = generateRandomString(6);
            const newEmail = `${username}${randomStr}@blondmail.com`;
            document.getElementById('mailkpInput').value = newEmail;

            showStatus('Đang tạo inbox...', 'info');

            try {
                const response = await fetch(`https://inboxes-com.p.rapidapi.com/inboxes/${newEmail}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-rapidapi-host': 'inboxes-com.p.rapidapi.com',
                        'x-rapidapi-key': '99ce4b7878msh6d53a5bae8037f0p112929jsn2dbaedf1cb0e'
                    },
                    body: JSON.stringify({})
                });

                const data = await response.json();
                
                if (data.activated) {
                    showStatus(`✅ Email ${newEmail} đã được kích hoạt!`, 'success');
                } else {
                    showStatus('⚠️ Không thể kích hoạt email', 'error');
                }
            } catch (error) {
                showStatus('❌ Lỗi khi tạo inbox: ' + error.message, 'error');
            }
        }

        async function getCode() {
            const mailkp = document.getElementById('mailkpInput').value;
            
            if (!mailkp) {
                showStatus('Vui lòng tạo email khôi phục trước', 'error');
                return;
            }

            showStatus('Đang lấy code...', 'info');

            try {
                const response = await fetch(`https://inboxes-com.p.rapidapi.com/inboxes/${mailkp}`, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-host': 'inboxes-com.p.rapidapi.com',
                        'x-rapidapi-key': '99ce4b7878msh6d53a5bae8037f0p112929jsn2dbaedf1cb0e'
                    }
                });

                const emails = await response.json();
                
                const googleEmail = emails.find(email => 
                    email.from.includes('noreply@google.com') && 
                    email.subject.includes('Email verification code')
                );

                if (googleEmail) {
                    const code = googleEmail.subject.split(':')[1].trim();
                    document.getElementById('codeInput').value = code;
                    showStatus(`✅ Đã lấy code: ${code}`, 'success');
                } else {
                    showStatus('⚠️ Chưa nhận được email verification. Thử lại sau vài giây...', 'error');
                }
            } catch (error) {
                showStatus('❌ Lỗi khi lấy code: ' + error.message, 'error');
            }
        }

        // =====================
        // 2FA GET CODE
        // =====================
        async function get2FACode() {
            const email2fa = document.getElementById('email2faInput').value.trim();

            if (!email2fa) {
                showStatus('Vui lòng nhập email 2FA trước', 'error');
                return;
            }

            showStatus('Đang lấy mã 2FA...', 'info');

            try {
                const response = await fetch(`https://inboxes-com.p.rapidapi.com/inboxes/${email2fa}`, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-host': 'inboxes-com.p.rapidapi.com',
                        'x-rapidapi-key': '99ce4b7878msh6d53a5bae8037f0p112929jsn2dbaedf1cb0e'
                    }
                });

                const emails = await response.json();

                if (!emails || emails.length === 0) {
                    showStatus('⚠️ Chưa có email nào trong hộp thư 2FA. Thử lại sau...', 'error');
                    return;
                }

                // Tìm email 2FA từ Google — thử nhiều subject phổ biến
                const twoFaEmail = emails.find(email =>
                    email.from && (
                        email.from.includes('noreply@google.com') ||
                        email.from.includes('google.com')
                    ) && (
                        (email.subject && email.subject.toLowerCase().includes('2-step')) ||
                        (email.subject && email.subject.toLowerCase().includes('verification code')) ||
                        (email.subject && email.subject.toLowerCase().includes('security code')) ||
                        (email.subject && email.subject.toLowerCase().includes('sign-in attempt')) ||
                        (email.subject && email.subject.toLowerCase().includes('new sign-in'))
                    )
                ) || emails[0]; // fallback: lấy email mới nhất nếu không match

                // Thử lấy code từ subject
                let code2fa = '';
                if (twoFaEmail && twoFaEmail.subject) {
                    const subjectMatch = twoFaEmail.subject.match(/\b\d{6,8}\b/);
                    if (subjectMatch) {
                        code2fa = subjectMatch[0];
                    }
                }

                // Nếu không lấy được từ subject, thử body
                if (!code2fa && twoFaEmail && twoFaEmail.body) {
                    const bodyMatch = twoFaEmail.body.match(/\b\d{6,8}\b/);
                    if (bodyMatch) {
                        code2fa = bodyMatch[0];
                    }
                }

                if (code2fa) {
                    document.getElementById('code2faInput').value = code2fa;
                    showStatus(`✅ Đã lấy mã 2FA: ${code2fa}`, 'success');
                } else {
                    showStatus('⚠️ Không tìm thấy mã 2FA trong email. Thử lại sau...', 'error');
                }

            } catch (error) {
                showStatus('❌ Lỗi khi lấy mã 2FA: ' + error.message, 'error');
            }
        }

        async function submitData() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const recovery = document.getElementById('mailkpInput').value;
            const phone = document.getElementById('phoneInput').value;
            const trail = document.getElementById('trailInput').value;
            const twofa = document.getElementById('email2faInput').value.trim(); // Email 2FA (input)
            const code2fa = document.getElementById('code2faInput').value.trim(); // Mã 2FA

            if (!email || !password || !recovery) {
                showStatus('Vui lòng điền đầy đủ thông tin', 'error');
                return;
            }

            const now = new Date();
            const created_at = now.toLocaleString('vi-VN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            showStatus('Đang submit...', 'info');

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbytvG-tfmicCmWLLt6hBH5gh7D-k_zWLeQLZl2TQ1D7VDoDaFWMBVtzrl6gfekiXhr7/exec', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        recovery: recovery,
                        phone: phone,
                        twofa: twofa,       // Email 2FA
                        code2fa: code2fa,   // Mã 2FA
                        trail: trail,
                        created_at: created_at
                    })
                });

                showStatus('✅ Submit thành công!', 'success');
                
            } catch (error) {
                showStatus('❌ Lỗi khi submit: ' + error.message, 'error');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }
    </script>
</body>
</html>
