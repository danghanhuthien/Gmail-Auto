        </div>

        <div class="input-group">
            <label>Email khôi phục (mailkp)</label>
            <div class="input-wrapper">
                <input type="text" id="mailkpInput" readonly placeholder="Email sẽ được tạo tự động">
                <button class="btn-get-code" onclick="getCode()">Get Code</button>
            </div>
        </div>

            <label>Verification Code</label>
            <input type="text" id="codeInput" readonly placeholder="Code sẽ được lấy tự động">
        </div>

        <!-- 2FA SECTION -->
        <div class="twofa-section">
            <div class="section-title">🔐 2FA Authentication (TOTP)</div>

            <div class="input-group">
                <label>Secret Key 2FA</label>
                <div class="input-wrapper">
                    <input type="text" id="secret2faInput" placeholder="Nhập secret key (vd: k6pe 6kcl...)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

                </div>
            </div>

            <div class="input-group">
                <label>Mã 2FA (6 số) <span id="totpTimer" style="color:#b45309;font-size:12px;font-weight:600;"></span></label>

                </div>
            </div>
        </div>

        <div class="input-group">
            <label>Trail</label>

                <option value="Không Trail">Không Trail</option>

            </select>
        </div>

        <button class="btn-submit" onclick="submitData()">Submit</button>

        <a href="viewdata.html" class="btn-view-data">📊 Xem dữ liệu</a>

                }
            });

            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('secret2faInput').value = text.trim();

            } catch (e) {
                document.getElementById('secret2faInput').focus();
                document.execCommand('paste');
                showStatus('✅ Đã dán Secret Key 2FA', 'success');

        function capitalizeFirst(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function generateFullName() {
            const firstName = capitalizeFirst(foreignFirstNames[Math.floor(Math.random() * foreignFirstNames.length)]);
            const lastName = capitalizeFirst(foreignLastNames[Math.floor(Math.random() * foreignLastNames.length)]);
            document.getElementById('firstNameInput').value = firstName;
            document.getElementById('lastNameInput').value = lastName;
            showStatus(`✅ Đã tạo tên: ${firstName} ${lastName}`, 'success');
        }

        function generateRandomName() {
            const firstName = foreignFirstNames[Math.floor(Math.random() * foreignFirstNames.length)];
            const lastName = foreignLastNames[Math.floor(Math.random() * foreignLastNames.length)];

            const suffixes = [
                'pro','vip','official','real','dev','main','acc','boss','king','tech',
                'cool','super','mega','ultra','top','best','star','online','zone','team',
                'studio','media','digital','plus','master','elite','prime','legend','gamer',
                'creator','builder','player','coder','world','hub','space','neo','nova','core'
            ];

            const connectors = [
                'x','z','the','mr','ms','real','iam','official','only','pro','vip',
                'true','alpha','beta','dark','light','lord','boss','king','hero','smart',
                'fast','wild','silent','super','ultra','mega'
            ];

            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            const connector = connectors[Math.floor(Math.random() * connectors.length)];
            const randomNum = Math.floor(Math.random() * 90000) + 10000;
            const shortNum = Math.floor(Math.random() * 9000) + 1000;

            const formats = [
                `${firstName}${lastName}${suffix}${randomNum}`,
                `${lastName}${firstName}${suffix}${randomNum}`,
                `${firstName}${suffix}${lastName}${randomNum}`,
                `${suffix}${firstName}${lastName}${randomNum}`,
                `${firstName}${connector}${lastName}${randomNum}`,
                `${lastName}${connector}${firstName}${randomNum}`,
                `${firstName}${lastName}${randomNum}${suffix}`,
                `${suffix}${randomNum}${firstName}${lastName}`,
                `${firstName}${lastName}${shortNum}`,
                `${connector}${firstName}${lastName}${suffix}${randomNum}`,
                `${firstName}${suffix}${randomNum}`,
                `${lastName}${firstName}${shortNum}${suffix}`
            ];

            return formats[Math.floor(Math.random() * formats.length)];
        }

        function generatePassword() {
            const firstName = document.getElementById('firstNameInput').value.trim();
            const lastName = document.getElementById('lastNameInput').value.trim();
        
            if (!firstName || !lastName) {
                showStatus('⚠️ Vui lòng Generate tên trước rồi mới Generate password', 'error');
                return;
            }
        
            const password = generateRandomPassword(firstName, lastName);
            document.getElementById('passwordInput').value = password;
            showStatus('✅ Đã tạo password: ' + password, 'success');
        }
        
        function generateRandomPassword(firstName, lastName) {
            const specials = '@$%&!#';
            const numbers = '0123456789';
        
            // Lấy một phần từ first/last name
            const nameParts = [
                firstName,
                lastName,
                firstName + lastName,
                lastName + firstName,
                firstName.slice(0, 3) + lastName,
                firstName + lastName.slice(0, 3),
            ];
        
            const baseName = nameParts[Math.floor(Math.random() * nameParts.length)];
        
            // Random số 2–4 chữ số
            const numLen = 2 + Math.floor(Math.random() * 3);
            let numStr = '';
            for (let i = 0; i < numLen; i++) {
                numStr += numbers.charAt(Math.floor(Math.random() * numbers.length));
            }
        
            // 1 ký tự đặc biệt
            const special = specials.charAt(Math.floor(Math.random() * specials.length));
        
            // Ghép lại theo các pattern ngẫu nhiên
            const patterns = [
                baseName + numStr + special,
                baseName + special + numStr,
                special + baseName + numStr,
                numStr + baseName + special,
                baseName.slice(0, 4) + special + numStr + baseName.slice(-3),
            ];
        
            return patterns[Math.floor(Math.random() * patterns.length)];
        }

        async function checkSMS() {
            if (!currentOrderId) {
                showStatus('Vui lòng Get OTP trước', 'error');
                return;
            }

            showStatus('Đang kiểm tra SMS...', 'info');

            try {
                const response = await fetch(`https://gmailios.vn/api/check-order/${currentOrderId}`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    const codeOtp = result.data.code_otp;
                    if (codeOtp && codeOtp !== '') {
                        document.getElementById('smsCodeInput').value = codeOtp;
                        showStatus(`✅ Đã nhận được SMS Code: ${codeOtp}`, 'success');
                    } else {
                        showStatus('⚠️ Chưa nhận được SMS. Thử lại sau...', 'error');
                    }
                } else {
                    showStatus('❌ Không thể kiểm tra SMS', 'error');
                }
            } catch (error) {
                showStatus('❌ Lỗi khi check SMS: ' + error.message, 'error');
            }
        }

        async function getCode() {
            const mailkp = document.getElementById('mailkpInput').value;
            
            if (!mailkp) {
                showStatus('Vui lòng tạo email khôi phục trước', 'error');
                return;
            }

            showStatus('Đang lấy code...', 'info');

            try {
                const response = await fetch(`https://inboxes-com.p.rapidapi.com/inboxes/${mailkp}`, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-host': 'inboxes-com.p.rapidapi.com',
                        'x-rapidapi-key': '99ce4b7878msh6d53a5bae8037f0p112929jsn2dbaedf1cb0e'
                    }
                });

                const emails = await response.json();
                
                const googleEmail = emails.find(email => 
                    email.from.includes('noreply@google.com') && 
                    email.subject.includes('Email verification code')
                );

                if (googleEmail) {
                    const code = googleEmail.subject.split(':')[1].trim();
                    document.getElementById('codeInput').value = code;
                    showStatus(`✅ Đã lấy code: ${code}`, 'success');
                } else {
                    showStatus('⚠️ Chưa nhận được email verification. Thử lại sau vài giây...', 'error');
                }
            } catch (error) {
                showStatus('❌ Lỗi khi lấy code: ' + error.message, 'error');
            }
        }

        // =====================
        // TOTP 2FA
        // =====================

        function base32Decode(base32) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            let bits = 0, value = 0;
            const output = [];
            const cleaned = base32.toUpperCase().replace(/\s+/g, '').replace(/=/g, '');
            for (let i = 0; i < cleaned.length; i++) {
                const idx = alphabet.indexOf(cleaned[i]);
                if (idx === -1) continue;
                value = (value << 5) | idx;
                bits += 5;
                if (bits >= 8) {
                    output.push((value >>> (bits - 8)) & 0xff);
                    bits -= 8;
                }
            }
            return new Uint8Array(output);
        }

        async function hmacSha1(keyBytes, msgBytes) {
            const key = await crypto.subtle.importKey(
                'raw', keyBytes,
                { name: 'HMAC', hash: 'SHA-1' },
                false, ['sign']
            );
            const sig = await crypto.subtle.sign('HMAC', key, msgBytes);
            return new Uint8Array(sig);
        }

        async function generateTOTP(secret, timeStep = 30, digits = 6) {
            const keyBytes = base32Decode(secret);
            const epoch = Math.floor(Date.now() / 1000);
            const counter = Math.floor(epoch / timeStep);

            const counterBytes = new Uint8Array(8);
            let c = counter;
            for (let i = 7; i >= 0; i--) {
                counterBytes[i] = c & 0xff;
                c = Math.floor(c / 256);
            }

            const hmac = await hmacSha1(keyBytes, counterBytes);
            const offset = hmac[hmac.length - 1] & 0x0f;
            const code = (
                ((hmac[offset] & 0x7f) << 24) |
                ((hmac[offset + 1] & 0xff) << 16) |
                ((hmac[offset + 2] & 0xff) << 8) |
                (hmac[offset + 3] & 0xff)
            ) % Math.pow(10, digits);

            return String(code).padStart(digits, '0');
        }

        let totpInterval = null;

        async function get2FACode() {
            const secret = document.getElementById('secret2faInput').value.trim();
            if (!secret) {
                showStatus('Vui lòng nhập Secret Key 2FA', 'error');
                return;
            }

            try {
                const code = await generateTOTP(secret);
                document.getElementById('code2faInput').value = code;
                showStatus(`✅ Mã 2FA: ${code}`, 'success');

                if (totpInterval) clearInterval(totpInterval);
                updateTotpTimer(secret);
                totpInterval = setInterval(() => updateTotpTimer(secret), 1000);
            } catch (e) {
                showStatus('❌ Secret key không hợp lệ: ' + e.message, 'error');
            }
        }

        async function updateTotpTimer(secret) {
            const remaining = 30 - (Math.floor(Date.now() / 1000) % 30);
            const timerEl = document.getElementById('totpTimer');
            if (timerEl) timerEl.textContent = `(còn ${remaining}s)`;

            if (remaining === 30) {
                try {
                    const code = await generateTOTP(secret);
                    document.getElementById('code2faInput').value = code;
                } catch(e) {}
            }
        }

        async function submitData() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const recovery = document.getElementById('mailkpInput').value;
            const phone = document.getElementById('phoneInput').value;
            const trail = document.getElementById('trailInput').value;
            const twofa = document.getElementById('secret2faInput').value.trim();
            const code2fa = document.getElementById('code2faInput').value.trim();
            const firstName = document.getElementById('firstNameInput').value.trim();
            const lastName = document.getElementById('lastNameInput').value.trim();

            if (!email || !password || !recovery) {
                showStatus('Vui lòng điền đầy đủ thông tin', 'error');
                return;
            }

            const now = new Date();
            const created_at = now.toLocaleString('vi-VN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            showStatus('Đang submit...', 'info');

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbytvG-tfmicCmWLLt6hBH5gh7D-k_zWLeQLZl2TQ1D7VDoDaFWMBVtzrl6gfekiXhr7/exec', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        first_name: firstName,
                        last_name: lastName,
                        email: email,
                        password: password,
                        recovery: recovery,
                        phone: phone,
                        "2fa": twofa,
                        code2fa: code2fa,
                        trail: trail,
                        created_at: created_at
                    })
                });

                showStatus('✅ Submit thành công!', 'success');
                
            } catch (error) {
                showStatus('❌ Lỗi khi submit: ' + error.message, 'error');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }
